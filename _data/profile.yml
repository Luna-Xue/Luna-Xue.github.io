short_bio: >-
  <p>
    I am a tenure-track Assistant Professor in the Department of Electrical and Computer Engineering at the <a href="https://www.ee.hawaii.edu/faculty/profile?usr=138" target="_blank">University of Hawaii at Mānoa</a>. My research lies at the intersection of wireless communication, cybersecurity, and artificial intelligence. 
  </p>
  <p>
    We develop trustworthy AI-native wireless systems by bridging physical-layer security, ISAC sensing, and learning at the RAN edge. Our work emphasizes privacy-preserving, resilient AI-RAN/O-RAN prototyping, and security against adaptive and generative AI threats. We are increasingly interested in ToM-inspired network agents for intent-aware, multi-stakeholder decision making in AI-RAN.
  </p>

  <p style="background-color: #f8f9fa; padding: 12px; margin-top: 24px; color: #db535a;">
    <em><strong>Prospective Students:</strong> <br>
    I am looking for self-motivated Ph.D. students to start in Fall 2026, Spring 2027, and later.</em>
  </p>

