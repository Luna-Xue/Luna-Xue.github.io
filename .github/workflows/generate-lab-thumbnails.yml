name: Generate Lab Thumbnails

on:
  push:
    paths:
      - "assets/img/lab/**"
      - "!assets/img/lab/thumbs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install thumbnail dependencies
        run: python -m pip install --upgrade pillow

      - name: Determine images to process
        id: changed
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "args=--all --skip-existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            git ls-files assets/img/lab > /tmp/lab-images.txt
          else
            git diff --name-only "$before" "${{ github.sha }}" -- assets/img/lab > /tmp/lab-images.txt
          fi

          echo "args=--from-list /tmp/lab-images.txt" >> "$GITHUB_OUTPUT"

      - name: Generate thumbnails
        run: python scripts/generate_lab_thumbnails.py ${{ steps.changed.outputs.args }}

      - name: Commit generated thumbnails
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- assets/img/lab/thumbs)" ]; then
            echo "No thumbnail changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/lab/thumbs
          git commit -m "Generate lab image thumbnails"
          git push
