<div class="container{% if page.header_logo %} page-header-with-logo{% endif %}">
  {% if page.header_logo %}
  <a href="{% include canonical-url.html %}" class="page-header-logo-link">
    <img src="{{ page.header_logo | relative_url }}" alt="{{ page.header_logo_alt | default: page.title }}" class="page-header-logo">
  </a>
  {% endif %}
  <div class="page-header-copy">
    <div class="clearfix">
      <a href="{% include canonical-url.html %}">
        <h2 class="page-title mt0 mb1">
          {% if page.header_title %}
            {{ page.header_title }}
          {% else %}
            {{ page.title }}
          {% endif %}
        </h2>
      </a>
    </div>
   
      <h4 class="page-description body-font gray mt1 regular">
        {% if page.subtitle %}
          {{ page.subtitle }}
        {% endif %}
        <!-- The world is a book and those who do not travel read only one page - Augustine of Hippo -->
      </h4>
  </div>
</div>
